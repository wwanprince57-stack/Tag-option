 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TagOption</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f4f7;
color:#111827;
}

header{
background:#111827;
color:white;
padding:22px;
text-align:center;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:7px 0 0;
opacity:.8;
}

.card{
width:92%;
max-width:450px;
background:white;
margin:25px auto;
padding:22px;
border-radius:16px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.hidden{
display:none;
}

h2,h3{
margin-top:0;
}

input,select{
width:100%;
padding:14px;
margin:7px 0;
border:1px solid #d1d5db;
border-radius:9px;
font-size:16px;
outline:none;
}

input:focus,select:focus{
border-color:#2563eb;
}

button{
width:100%;
padding:14px;
margin:7px 0;
border:0;
border-radius:9px;
font-size:16px;
font-weight:bold;
color:white;
cursor:pointer;
}

.blue{
background:#2563eb;
}

.green{
background:#16a34a;
}

.red{
background:#dc2626;
}

.dark{
background:#111827;
}

.gray{
background:#6b7280;
}

.message{
text-align:center;
font-weight:bold;
margin-top:12px;
}

.balance{
background:#eef2ff;
padding:18px;
border-radius:12px;
text-align:center;
margin-bottom:18px;
}

.balance h2{
font-size:25px;
margin:8px 0 0;
}

.menu{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.panel{
margin-top:18px;
padding-top:10px;
border-top:1px solid #ddd;
}

.small{
font-size:13px;
color:#6b7280;
line-height:1.5;
}

.success{
color:#15803d;
}

.error{
color:#dc2626;
}

</style>
</head>

<body>

<header>

<h1>TagOption</h1>

<p>Simple Trading Platform</p>

</header>


<!-- LOGIN -->

<div id="loginPage" class="card">

<h2>LOGIN</h2>

<input
id="loginEmail"
type="email"
placeholder="Email"
>

<input
id="loginPassword"
type="password"
placeholder="Password"
>

<button
id="loginButton"
class="blue"
>
LOGIN
</button>

<button
id="openCreateButton"
class="dark"
>
CREATE ACCOUNT
</button>

<p
id="loginMessage"
class="message"
></p>

</div>



<!-- CREATE ACCOUNT -->

<div id="createPage" class="card hidden">

<h2>CREATE ACCOUNT</h2>

<input
id="fullName"
type="text"
placeholder="Full Name"
>

<input
id="createEmail"
type="email"
placeholder="Email"
>

<input
id="createPassword"
type="password"
placeholder="Strong Password"
>

<p class="small">
Password must contain at least 8 characters,
one uppercase letter, one lowercase letter,
one number and one symbol.
</p>

<button
id="createAccountButton"
class="blue"
>
CREATE ACCOUNT
</button>

<button
id="backLoginButton"
class="gray"
>
BACK TO LOGIN
</button>

<p
id="createMessage"
class="message"
></p>

</div>



<!-- DASHBOARD -->

<div id="dashboardPage" class="card hidden">

<h2 id="welcomeText">
Welcome
</h2>

<div class="balance">

Available Balance

<h2 id="balanceText">
KSh 0.00
</h2>

</div>


<div class="menu">

<button
id="depositButton"
class="green"
>
DEPOSIT
</button>

<button
id="withdrawButton"
class="red"
>
WITHDRAW
</button>

<button
id="tradeButton"
class="blue"
>
TRADE
</button>

<button
id="historyButton"
class="dark"
>
HISTORY
</button>

</div>


<button
id="profileButton"
class="blue"
>
PROFILE
</button>

<button
id="logoutButton"
class="gray"
>
LOGOUT
</button>


<div
id="dashboardPanel"
class="panel"
>
</div>

</div>



<script>

/* =========================
   BASIC DATA
========================= */

let balance =
Number(
localStorage.getItem("tagoption_balance") || "0"
);

let trades =
JSON.parse(
localStorage.getItem("tagoption_trades") || "[]"
);



/* =========================
   PAGE SWITCHING
========================= */

function showPage(page){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("createPage")
.classList.add("hidden");

document.getElementById("dashboardPage")
.classList.add("hidden");

document.getElementById(page)
.classList.remove("hidden");

}



/* =========================
   BALANCE
========================= */

function updateBalance(){

document.getElementById("balanceText")
.innerText =
"KSh " + balance.toFixed(2);

localStorage.setItem(
"tagoption_balance",
balance
);

}



/* =========================
   OPEN CREATE ACCOUNT
========================= */

document
.getElementById("openCreateButton")
.addEventListener("click",function(){

document.getElementById("createMessage")
.innerText="";

showPage("createPage");

});



/* =========================
   BACK TO LOGIN
========================= */

document
.getElementById("backLoginButton")
.addEventListener("click",function(){

document.getElementById("createMessage")
.innerText="";

showPage("loginPage");

});



/* =========================
   CREATE ACCOUNT
========================= */

document
.getElementById("createAccountButton")
.addEventListener("click",function(){

let name =
document.getElementById("fullName")
.value
.trim();

let email =
document.getElementById("createEmail")
.value
.trim();

let password =
document.getElementById("createPassword")
.value;



/* NAME CHECK */

if(name.length < 2){

document.getElementById("createMessage")
.innerText =
"Enter your full name.";

document.getElementById("createMessage")
.className =
"message error";

return;

}



/* EMAIL CHECK */

if(
email.indexOf("@") === -1 ||
email.indexOf(".") === -1
){

document.getElementById("createMessage")
.innerText =
"Enter a valid email.";

document.getElementById("createMessage")
.className =
"message error";

return;

}



/* PASSWORD CHECK */

if(password.length < 8){

document.getElementById("createMessage")
.innerText =
"Password must have at least 8 characters.";

document.getElementById("createMessage")
.className =
"message error";

return;

}

if(!/[A-Z]/.test(password)){

document.getElementById("createMessage")
.innerText =
"Password needs an uppercase letter.";

document.getElementById("createMessage")
.className =
"message error";

return;

}

if(!/[a-z]/.test(password)){

document.getElementById("createMessage")
.innerText =
"Password needs a lowercase letter.";

document.getElementById("createMessage")
.className =
"message error";

return;

}

if(!/[0-9]/.test(password)){

document.getElementById("createMessage")
.innerText =
"Password needs a number.";

document.getElementById("createMessage")
.className =
"message error";

return;

}

if(!/[^A-Za-z0-9]/.test(password)){

document.getElementById("createMessage")
.innerText =
"Password needs a symbol.";

document.getElementById("createMessage")
.className =
"message error";

return;

}



/* SAVE ACCOUNT */

localStorage.setItem(
"tagoption_name",
name
);

localStorage.setItem(
"tagoption_email",
email
);

localStorage.setItem(
"tagoption_password",
password
);



/* SUCCESS MESSAGE */

document.getElementById("createMessage")
.innerText =
"Account created successfully!";

document.getElementById("createMessage")
.className =
"message success";



/* RETURN TO LOGIN */

setTimeout(function(){

document.getElementById("loginEmail")
.value =
email;

document.getElementById("loginPassword")
.value =
"";

document.getElementById("loginMessage")
.innerText =
"Account created. Login now.";

document.getElementById("loginMessage")
.className =
"message success";

showPage("loginPage");

},1200);

});



/* =========================
   LOGIN
========================= */

document
.getElementById("loginButton")
.addEventListener("click",function(){

let email =
document.getElementById("loginEmail")
.value
.trim();

let password =
document.getElementById("loginPassword")
.value;

let savedEmail =
localStorage.getItem(
"tagoption_email"
);

let savedPassword =
localStorage.getItem(
"tagoption_password"
);



if(
email === savedEmail &&
password === savedPassword
){

let name =
localStorage.getItem(
"tagoption_name"
);

document.getElementById("welcomeText")
.innerText =
"Welcome, " + name;

document.getElementById("loginMessage")
.innerText="";

updateBalance();

showPage("dashboardPage");

}else{

document.getElementById("loginMessage")
.innerText =
"Email or password is incorrect.";

document.getElementById("loginMessage")
.className =
"message error";

}

});



/* =========================
   DEPOSIT
========================= */

document
.getElementById("depositButton")
.addEventListener("click",function(){

document.getElementById("dashboardPanel")
.innerHTML = `

<h3>DEPOSIT</h3>

<p class="small">
Demo deposit only. No real money is transferred.
</p>

<input
id="depositAmount"
type="number"
placeholder="Amount in KSh"
>

<button
id="confirmDeposit"
class="green"
>
ADD DEMO BALANCE
</button>

<p
id="depositMessage"
class="message"
></p>

`;

document
.getElementById("confirmDeposit")
.addEventListener("click",function(){

let amount =
Number(
document.getElementById("depositAmount")
.value
);

if(amount <= 0){

document.getElementById("depositMessage")
.innerText =
"Enter a valid amount.";

return;

}

balance += amount;

updateBalance();

document.getElementById("depositMessage")
.innerText =
"Demo balance added: KSh " +
amount.toFixed(2);

});

});



/* =========================
   WITHDRAW
========================= */

document
.getElementById("withdrawButton")
.addEventListener("click",function(){

document.getElementById("dashboardPanel")
.innerHTML = `

<h3>WITHDRAW</h3>

<p class="small">
Demo withdrawal only. No real M-PESA transaction is made.
</p>

<input
id="withdrawAmount"
type="number"
placeholder="Amount in KSh"
>

<input
id="withdrawPhone"
type="tel"
placeholder="M-PESA phone number"
>

<button
id="confirmWithdraw"
class="red"
>
REQUEST DEMO WITHDRAWAL
</button>

<p
id="withdrawMessage"
class="message"
></p>

`;

document
.getElementById("confirmWithdraw")
.addEventListener("click",function(){

let amount =
Number(
document.getElementById("withdrawAmount")
.value
);

let phone =
document.getElementById("withdrawPhone")
.value
.trim();

if(amount <= 0){

document.getElementById("withdrawMessage")
.innerText =
"Enter a valid amount.";

return;

}

if(phone === ""){

document.getElementById("withdrawMessage")
.innerText =
"Enter your phone number.";

return;

}

if(amount > balance){

document.getElementById("withdrawMessage")
.innerText =
"Insufficient demo balance.";

return;

}

balance -= amount;

updateBalance();

document.getElementById("withdrawMessage")
.innerText =
"Demo withdrawal request created.";

});

});



/* =========================
   TRADE
========================= */

document
.getElementById("tradeButton")
.addEventListener("click",function(){

document.getElementById("dashboardPanel")
.innerHTML = `

<h3>TRADE</h3>

<select id="assetSelect">

<option>
Volatility 100
</option>

<option>
Volatility 75
</option>

<option>
Gold
</option>

<option>
EUR/USD
</option>

<option>
BTC/USD
</option>

</select>

<input
id="tradeStake"
type="number"
placeholder="Enter stake in KSh"
>

<button
id="buyButton"
class="green"
>
BUY
</button>

<button
id="sellButton"
class="red"
>
SELL
</button>

<p
id="tradeMessage"
class="message"
></p>

`;



function createTrade(type){

let amount =
Number(
document.getElementById("tradeStake")
.value
);

let asset =
document.getElementById("assetSelect")
.value;



if(amount <= 0){

document.getElementById("tradeMessage")
.innerText =
"Enter a valid stake.";

return;

}



if(amount > balance){

document.getElementById("tradeMessage")
.innerText =
"Insufficient demo balance.";

return;

}



balance -= amount;

updateBalance();



let trade = {

type:type,

asset:asset,

amount:amount,

time:new Date().toLocaleString()

};



trades.unshift(trade);



localStorage.setItem(
"tagoption_trades",
JSON.stringify(trades)
);



document.getElementById("tradeMessage")
.innerText =
type +
" demo order created successfully.";

}



document
.getElementById("buyButton")
.addEventListener("click",function(){

createTrade("BUY");

});



document
.getElementById("sellButton")
.addEventListener("click",function(){

createTrade("SELL");

});

});



/* =========================
   HISTORY
========================= */

document
.getElementById("historyButton")
.addEventListener("click",function(){

let html =
"<h3>HISTORY</h3>";



if(trades.length === 0){

html +=
"<p>No trades yet.</p>";

}else{

for(let i=0;i<trades.length;i++){

let trade =
trades[i];

html += `

<div style="
padding:12px;
margin:8px 0;
background:#f3f4f6;
border-radius:8px;
">

<b>${trade.type}</b>

<br>

Asset:
${trade.asset}

<br>

Stake:
KSh ${Number(trade.amount).toFixed(2)}

<br>

Time:
${trade.time}

</div>

`;

}

}



document
.getElementById("dashboardPanel")
.innerHTML =
html;

});



/* =========================
   PROFILE
========================= */

document
.getElementById("profileButton")
.addEventListener("click",function(){

let name =
localStorage.getItem(
"tagoption_name"
);

let email =
localStorage.getItem(
"tagoption_email"
);



document
.getElementById("dashboardPanel")
.innerHTML = `

<h3>PROFILE</h3>

<p>
<b>Name:</b>
${name || ""}
</p>

<p>
<b>Email:</b>
${email || ""}
</p>

<p class="small">
This is a demo profile.
</p>

`;

});



/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutButton")
.addEventListener("click",function(){

document.getElementById("loginEmail")
.value="";

document.getElementById("loginPassword")
.value="";

document.getElementById("dashboardPanel")
.innerHTML="";

showPage("loginPage");

});



/* =========================
   START APP
========================= */

updateBalance();

showPage("loginPage");

</script>

</body>
</html>
