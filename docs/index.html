 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TagOption</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 500px;
  margin: 30px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #111827;
  color: white;
  font-size: 16px;
}

.signup {
  background: #2563eb;
}

.buy {
  background: #16a34a;
}

.sell {
  background: #dc2626;
}

.logout {
  background: #6b7280;
}

.balance {
  background: #eef2ff;
  padding: 15px;
  border-radius: 10px;
  margin: 20px 0;
  text-align: center;
}

.trade-buttons {
  display: flex;
  gap: 10px;
}

.trade-buttons button {
  flex: 1;
}

#signup,
#dashboard {
  display: none;
}

.message {
  text-align: center;
  margin-top: 15px;
}
</style>
</head>

<body>

<header>
<h1>TagOption</h1>
<p>Simple Trading Platform</p>
</header>

<div class="container">

<!-- LOGIN -->
<div id="login" class="card">
<h2>Login</h2>

<input type="email" id="loginEmail" placeholder="Email">

<input type="password" id="loginPassword" placeholder="Password">

<button onclick="login()">Login</button>

<button class="signup" onclick="showSignup()">Create Account</button>

<p id="loginMessage" class="message"></p>
</div>


<!-- CREATE ACCOUNT -->
<div id="signup" class="card">
<h2>Create Account</h2>

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="signupEmail" placeholder="Email">

<input type="password" id="signupPassword" placeholder="Password">

<button class="signup" onclick="createAccount()">Create Account</button>

<button onclick="showLogin()">Back to Login</button>

<p id="signupMessage" class="message"></p>
</div>


<!-- DASHBOARD -->
<div id="dashboard">

<div class="card">

<h2>Welcome to TagOption</h2>

<div class="balance">
<strong>Balance</strong>
<h2 id="balance">KSh 0.00</h2>
</div>

<input type="number" id="amount" placeholder="Enter amount">

<div class="trade-buttons">

<button class="buy" onclick="trade('BUY')">
BUY
</button>

<button class="sell" onclick="trade('SELL')">
SELL
</button>

</div>

<button class="logout" onclick="logout()">Logout</button>

<p id="tradeMessage" class="message"></p>

</div>

</div>

</div>


<script>

function showSignup() {
  document.getElementById("login").style.display = "none";
  document.getElementById("signup").style.display = "block";
}

function showLogin() {
  document.getElementById("signup").style.display = "none";
  document.getElementById("login").style.display = "block";
}

function createAccount() {

  const name = document.getElementById("name").value;
  const email = document.getElementById("signupEmail").value;
  const password = document.getElementById("signupPassword").value;

  if (name === "" || email === "" || password === "") {
    document.getElementById("signupMessage").innerText =
      "Please fill all fields.";
    return;
  }

  localStorage.setItem("tagName", name);
  localStorage.setItem("tagEmail", email);
  localStorage.setItem("tagPassword", password);

  document.getElementById("signupMessage").innerText =
    "Account created successfully!";

  setTimeout(showLogin, 1000);
}

function login() {

  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  const savedEmail = localStorage.getItem("tagEmail");
  const savedPassword = localStorage.getItem("tagPassword");

  if (email === savedEmail && password === savedPassword) {

    document.getElementById("login").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

  } else {

    document.getElementById("loginMessage").innerText =
      "Email or password is incorrect.";

  }
}

function logout() {

  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login").style.display = "block";

}

function trade(type) {

  const amount = document.getElementById("amount").value;

  if (amount === "" || amount <= 0) {

    document.getElementById("tradeMessage").innerText =
      "Enter a valid amount.";

    return;
  }

  document.getElementById("tradeMessage").innerText =
    type + " order created for KSh " + amount;

}

</script>

</body>
</html>
