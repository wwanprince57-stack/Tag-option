 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TagOption</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f4f7;
color:#111827;
}

header{
background:#111827;
color:white;
padding:22px;
text-align:center;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:7px 0 0;
opacity:.8;
}

.card{
width:92%;
max-width:450px;
background:white;
margin:25px auto;
padding:22px;
border-radius:16px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.hidden{display:none}

h2,h3{margin-top:0}

input,select{
width:100%;
padding:14px;
margin:7px 0;
border:1px solid #d1d5db;
border-radius:9px;
font-size:16px;
outline:none;
}

input:focus,select:focus{
border-color:#2563eb;
}

button{
width:100%;
padding:14px;
margin:7px 0;
border:0;
border-radius:9px;
font-size:16px;
font-weight:bold;
color:white;
cursor:pointer;
}

.blue{background:#2563eb}
.green{background:#16a34a}
.red{background:#dc2626}
.dark{background:#111827}
.gray{background:#6b7280}

.message{
text-align:center;
font-weight:bold;
margin-top:12px;
}

.balance{
background:#eef2ff;
padding:18px;
border-radius:12px;
text-align:center;
margin-bottom:18px;
}

.balance h2{
font-size:25px;
margin:8px 0 0;
}

.menu{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.panel{
margin-top:18px;
padding-top:10px;
border-top:1px solid #ddd;
}

.small{
font-size:13px;
color:#6b7280;
line-height:1.5;
}

.success{color:#15803d}
.error{color:#dc2626}

.password-box{
margin-top:8px;
padding:12px;
background:#f9fafb;
border-radius:10px;
font-size:14px;
line-height:1.8;
}

.requirement{
display:block;
}

.valid{
color:#16a34a;
}

.invalid{
color:#dc2626;
}

</style>
</head>

<body>

<header>
<h1>TagOption</h1>
<p>Simple Trading Platform</p>
</header>


<!-- LOGIN -->

<div id="loginPage" class="card">

<h2>LOGIN</h2>

<input
id="loginEmail"
type="email"
placeholder="Email"
>

<input
id="loginPassword"
type="password"
placeholder="Password"
>

<button
id="loginButton"
class="blue"
>
LOGIN
</button>

<button
id="openCreateButton"
class="dark"
>
CREATE ACCOUNT
</button>

<p
id="loginMessage"
class="message"
></p>

</div>


<!-- CREATE ACCOUNT -->

<div id="createPage" class="card hidden">

<h2>CREATE ACCOUNT</h2>

<input
id="fullName"
type="text"
placeholder="Full Name"
>

<input
id="createEmail"
type="email"
placeholder="Email"
>

<input
id="createPassword"
type="password"
placeholder="Password"
>

<div class="password-box">

<b>Password requirements</b>

<span
id="reqLength"
class="requirement invalid"
>
❌ 8 characters minimum
</span>

<span
id="reqUpper"
class="requirement invalid"
>
❌ Uppercase letter (A-Z)
</span>

<span
id="reqLower"
class="requirement invalid"
>
❌ Lowercase letter (a-z)
</span>

<span
id="reqNumber"
class="requirement invalid"
>
❌ Number (0-9)
</span>

<span
id="reqSymbol"
class="requirement invalid"
>
❌ Symbol (! @ # $ %)
</span>

</div>


<button
id="createAccountButton"
class="blue"
>
CREATE ACCOUNT
</button>

<button
id="backLoginButton"
class="gray"
>
BACK TO LOGIN
</button>

<p
id="createMessage"
class="message"
></p>

</div>


<!-- DASHBOARD -->

<div id="dashboardPage" class="card hidden">

<h2 id="welcomeText">
Welcome
</h2>

<div class="balance">

Available Balance

<h2 id="balanceText">
KSh 0.00
</h2>

</div>

<div class="menu">

<button
id="depositButton"
class="green"
>
DEPOSIT
</button>

<button
id="withdrawButton"
class="red"
>
WITHDRAW
</button>

<button
id="tradeButton"
class="blue"
>
TRADE
</button>

<button
id="historyButton"
class="dark"
>
HISTORY
</button>

</div>

<button
id="profileButton"
class="blue"
>
PROFILE
</button>

<button
id="logoutButton"
class="gray"
>
LOGOUT
</button>

<div
id="dashboardPanel"
class="panel"
>
</div>

</div>


<script>

/* =========================
   DATA
========================= */

let balance =
Number(
localStorage.getItem("tagoption_balance") || "0"
);

let trades =
JSON.parse(
localStorage.getItem("tagoption_trades") || "[]"
);


/* =========================
   PAGE SWITCH
========================= */

function showPage(page){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("createPage")
.classList.add("hidden");

document
.getElementById("dashboardPage")
.classList.add("hidden");

document
.getElementById(page)
.classList.remove("hidden");

}


/* =========================
   BALANCE
========================= */

function updateBalance(){

document
.getElementById("balanceText")
.innerText =
"KSh " + balance.toFixed(2);

localStorage.setItem(
"tagoption_balance",
balance
);

}


/* =========================
   CREATE PAGE
========================= */

document
.getElementById("openCreateButton")
.addEventListener("click",function(){

document
.getElementById("createMessage")
.innerText="";

showPage("createPage");

});


/* =========================
   BACK LOGIN
========================= */

document
.getElementById("backLoginButton")
.addEventListener("click",function(){

showPage("loginPage");

});


/* =========================
   PASSWORD LIVE CHECK
========================= */

document
.getElementById("createPassword")
.addEventListener("input",function(){

let password=this.value;


/* LENGTH */

if(password.length>=8){

document
.getElementById("reqLength")
.innerText="✓ 8 characters minimum";

document
.getElementById("reqLength")
.className="requirement valid";

}else{

document
.getElementById("reqLength")
.innerText="❌ 8 characters minimum";

document
.getElementById("reqLength")
.className="requirement invalid";

}


/* UPPERCASE */

if(/[A-Z]/.test(password)){

document
.getElementById("reqUpper")
.innerText="✓ Uppercase letter (A-Z)";

document
.getElementById("reqUpper")
.className="requirement valid";

}else{

document
.getElementById("reqUpper")
.innerText="❌ Uppercase letter (A-Z)";

document
.getElementById("reqUpper")
.className="requirement invalid";

}


/* LOWERCASE */

if(/[a-z]/.test(password)){

document
.getElementById("reqLower")
.innerText="✓ Lowercase letter (a-z)";

document
.getElementById("reqLower")
.className="requirement valid";

}else{

document
.getElementById("reqLower")
.innerText="❌ Lowercase letter (a-z)";

document
.getElementById("reqLower")
.className="requirement invalid";

}


/* NUMBER */

if(/[0-9]/.test(password)){

document
.getElementById("reqNumber")
.innerText="✓ Number (0-9)";

document
.getElementById("reqNumber")
.className="requirement valid";

}else{

document
.getElementById("reqNumber")
.innerText="❌ Number (0-9)";

document
.getElementById("reqNumber")
.className="requirement invalid";

}


/* SYMBOL */

if(/[^A-Za-z0-9]/.test(password)){

document
.getElementById("reqSymbol")
.innerText="✓ Symbol (! @ # $ %)";

document
.getElementById("reqSymbol")
.className="requirement valid";

}else{

document
.getElementById("reqSymbol")
.innerText="❌ Symbol (! @ # $ %)";

document
.getElementById("reqSymbol")
.className="requirement invalid";

}

});


/* =========================
   CREATE ACCOUNT
========================= */

document
.getElementById("createAccountButton")
.addEventListener("click",function(){

let name =
document
.getElementById("fullName")
.value
.trim();

let email =
document
.getElementById("createEmail")
.value
.trim();

let password =
document

.value;

if(name.length<2){

document
.getElementById("createMessage")
.innerText=
"Enter your full name.";

return;

}


/* EMAIL */

if(
email.indexOf("@")===-1 ||
email.indexOf(".")===-1
){

document
.getElementById("createMessage")
.innerText=
"Enter a valid email.";

return;

}


/* PASSWORD */

if(
password.length<8 ||
!/[A-Z]/.test(password) ||
!/[a-z]/.test(password) ||
!/[0-9]/.test(password) ||
!/[^A-Za-z0-9]/.test(password)
){

document
.getElementById("createMessage")
.innerText=
"Complete all password requirements.";

document
.getElementById("createMessage")
.className=
"message error";

return;

}


/* SAVE */

localStorage.setItem(
"tagoption_name",
name
);

localStorage.setItem(
"tagoption_email",
email
);

localStorage.setItem(
"tagoption_password",
password
);


/* SUCCESS */

document
.getElementById("createMessage")
.innerText=
"Account created successfully!";

document
.getElementById("createMessage")
.className=
"message success";

.getElementById
