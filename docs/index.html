 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TagOption</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#111827;
padding-bottom:82px;
}

button,input,select{
font:inherit;
}

button{
cursor:pointer;
border:0;
}

.hidden{
display:none!important;
}

/* LOGIN */

.auth{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:#111827;
}

.auth-card{
width:100%;
max-width:420px;
background:#fff;
border-radius:24px;
padding:28px 22px;
box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo-icon{
width:64px;
height:64px;
border-radius:20px;
background:#2563eb;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;
margin:auto;
}

.logo h1{
margin:12px 0 5px;
}

.logo p{
margin:0;
color:#6b7280;
}

.field{
margin:12px 0;
}

.field label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:6px;
color:#374151;
}

input,select{
width:100%;
padding:14px;
border:1px solid #d1d5db;
border-radius:12px;
background:#fff;
outline:none;
}

input:focus,select:focus{
border-color:#2563eb;
}

.password{
position:relative;
}

.password input{
padding-right:50px;
}

.eye{
position:absolute;
right:5px;
top:5px;
width:42px;
height:42px;
background:transparent;
font-size:19px;
}

.primary{
width:100%;
padding:15px;
border-radius:12px;
background:#2563eb;
color:#fff;
font-weight:bold;
margin-top:8px;
}

.secondary{
width:100%;
padding:14px;
border-radius:12px;
background:#eef2ff;
color:#2563eb;
font-weight:bold;
margin-top:8px;
}

.message{
text-align:center;
font-size:14px;
font-weight:bold;
margin-top:12px;
}

.success{color:#16a34a}
.error{color:#dc2626}

.requirements{
background:#f8fafc;
border-radius:12px;
padding:10px 12px;
font-size:12px;
line-height:1.8;
}

.req.bad{color:#dc2626}
.req.good{color:#16a34a}


/* APP */

.app{
max-width:520px;
margin:auto;
min-height:100vh;
}

.top{
padding:20px 18px 15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.top small{
color:#6b7280;
}

.top h2{
margin:4px 0 0;
font-size:22px;
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
background:#2563eb;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.content{
padding:0 16px;
}


/* BALANCE */

.balance-card{
background:#111827;
color:#fff;
border-radius:22px;
padding:22px;
position:relative;
overflow:hidden;
}

.balance-card small{
opacity:.7;
}

.balance-card h1{
font-size:31px;
margin:8px 0 18px;
}

.balance-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.balance-actions button{
padding:12px;
border-radius:11px;
font-weight:bold;
}

.deposit-btn{
background:#fff;
color:#111827;
}

.withdraw-btn{
background:#374151;
color:#fff;
}


/* SECTION */

.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin:23px 2px 10px;
}

.section-title h3{
margin:0;
font-size:17px;
}

.section-title span{
font-size:12px;
color:#6b7280;
}


/* MARKET */

.market{
background:#fff;
border-radius:18px;
padding:16px;
border:1px solid #e5e7eb;
}

.market-top{
display:flex;
justify-content:space-between;
align-items:center;
}

.market-name{
font-weight:bold;
}

.market-price{
font-size:22px;
font-weight:bold;
margin-top:5px;
}

.up{
color:#16a34a;
font-size:12px;
}


/* MINI CHART */

.chart{
height:110px;
margin-top:12px;
display:flex;
align-items:flex-end;
gap:4px;
overflow:hidden;
}

.bar{
width:8px;
background:#2563eb;
border-radius:5px 5px 2px 2px;
opacity:.8;
}


/* QUICK */

.quick{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.quick-card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:17px;
padding:16px;
}

.quick-icon{
font-size:24px;
}

.quick-card b{
display:block;
margin-top:10px;
}

.quick-card small{
color:#6b7280;
}


/* TRADE */

.trade-card{
background:#fff;
border-radius:20px;
padding:17px;
border:1px solid #e5e7eb;
}

.price-large{
background:#111827;
color:#fff;
padding:18px;
border-radius:15px;
text-align:center;
margin-bottom:14px;
}

.price-large small{
opacity:.65;
}

.price-large strong{
display:block;
font-size:31px;
margin-top:5px;
}

.trade-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:12px;
}

.buy{
background:#16a34a;
color:#fff;
padding:16px;
border-radius:13px;
font-weight:bold;
}

.sell{
background:#dc2626;
color:#fff;
padding:16px;
border-radius:13px;
font-weight:bold;
}

.demo-note{
text-align:center;
font-size:11px;
color:#6b7280;
margin-top:13px;
}


/* HISTORY */

.history-item{
background:#fff;
border:1px solid #e5e7eb;
border-radius:16px;
padding:15px;
margin-bottom:10px;
}

.history-row{
display:flex;
justify-content:space-between;
margin:5px 0;
font-size:13px;
}

.status{
font-size:11px;
font-weight:bold;
color:#2563eb;
}


/* PROFILE */

.profile-card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:20px;
padding:20px;
}

.profile-avatar{
width:70px;
height:70px;
border-radius:50%;
background:#2563eb;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
margin-bottom:15px;
}

.profile-line{
padding:13px 0;
border-bottom:1px solid #eee;
}


/* BOTTOM NAV */

.bottom{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
height:72px;
background:#fff;
border-top:1px solid #e5e7eb;
display:grid;
grid-template-columns:repeat(4,1fr);
z-index:20;
}

.nav{
background:#fff;
color:#6b7280;
font-size:11px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
}

.nav-icon{
font-size:20px;
}

.nav.active{
color:#2563eb;
font-weight:bold;
}


/* PANEL */

.panel{
margin-top:18px;
}

.close{
background:#eef2f2;
color:#374151;
padding:10px;
border-radius:10px;
width:100%;
margin-top:10px;
}
</style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginScreen" class="auth">

<div class="auth-card">

<div class="logo">
<div class="logo-icon">T</div>
<h1>TagOption</h1>
<p>Simple Trading Platform</p>
</div>

<div class="field">
<label>Email</label>
<input id="loginEmail" type="email" placeholder="Enter email">
</div>

<div class="field">
<label>Password</label>

<div class="password">

<input id="loginPassword" type="password" placeholder="Enter password">

<button id="loginEye" class="eye" type="button">👁️</button>

</div>
</div>

<button id="loginBtn" class="primary">
LOGIN
</button>

<button id="openRegister" class="secondary">
CREATE ACCOUNT
</button>

<p id="loginMsg" class="message"></p>

</div>
</div>


<!-- ================= REGISTER ================= -->

<div id="registerScreen" class="auth hidden">

<div class="auth-card">

<div class="logo">
<div class="logo-icon">T</div>
<h1>Create Account</h1>
<p>Join TagOption</p>
</div>

<div class="field">
<label>Full Name</label>
<input id="regName" type="text" placeholder="Full name">
</div>

<div class="field">
<label>Email</label>
<input id="regEmail" type="email" placeholder="Email">
</div>

<div class="field">
<label>Password</label>

<div class="password">

<input id="regPassword" type="password" placeholder="Create password">

<button id="regEye" class="eye" type="button">👁️</button>

</div>
</div>

<div class="requirements">

<b>Password requirements</b>

<div id="req1" class="req bad">❌ 8 characters minimum</div>
<div id="req2" class="req bad">❌ Uppercase letter</div>
<div id="req3" class="req bad">❌ Lowercase letter</div>
<div id="req4" class="req bad">❌ Number</div>
<div id="req5" class="req bad">❌ Symbol</div>

</div>

<button id="registerBtn" class="primary">
CREATE ACCOUNT
</button>

<button id="backLogin" class="secondary">
BACK TO LOGIN
</button>

<p id="registerMsg" class="message"></p>

</div>
</div>


<!-- ================= APP ================= -->

<div id="app" class="app hidden">

<div class="top">

<div>
<small>Welcome back</small>
<h2 id="userName">User</h2>
</div>

<div id="avatar" class="avatar">U</div>

</div>


<div class="content">


<!-- HOME -->

<div id="homePage">

<div class="balance-card">

<small>Available Balance</small>

<h1 id="balanceText">KSh 0.00</h1>

<div class="balance-actions">

<button id="homeDeposit
