 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TagOption</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      max-width: 430px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #2563eb;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    TagOption
  </header>

  <div class="container">

    <!-- LOGIN -->
    <div class="card" id="loginBox">

      <h2>Login</h2>

      <input
        type="email"
        id="loginEmail"
        placeholder="Email"
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
      >

      <button onclick="login()">
        Login
      </button>

      <div class="switch" onclick="showSignup()">
        Don't have an account? Create account
      </div>

      <div class="message" id="loginMessage"></div>

    </div>


    <!-- SIGN UP -->
    <div class="card hidden" id="signupBox">

      <h2>Create Account</h2>

      <input
        type="text"
        id="signupName"
        placeholder="Full name"
      >

      <input
        type="email"
        id="signupEmail"
        placeholder="Email"
      >

      <input
        type="password"
        id="signupPassword"
        placeholder="Password"
      >

      <button onclick="signup()">
        Create Account
      </button>

      <div class="switch" onclick="showLogin()">
        Already have an account? Login
      </div>

      <div class="message" id="signupMessage"></div>

    </div>

  </div>


  <script>

    function showSignup() {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("signupBox").classList.remove("hidden");
    }


    function showLogin() {
      document.getElementById("signupBox").classList.add("hidden");
      document.getElementById("loginBox").classList.remove("hidden");
    }


    function signup() {

      const name =
        document.getElementById("signupName").value.trim();

      const email =
        document.getElementById("signupEmail").value.trim();

      const password =
        document.getElementById("signupPassword").value;

      const message =
        document.getElementById("signupMessage");


      if (!name || !email || !password) {
        message.textContent = "Please fill in all fields.";
        return;
      }


      if (password.length < 6) {
        message.textContent =
          "Password must be at least 6 characters.";
        return;
      }


      const user = {
        name: name,
        email: email,
        password: password
      };


      localStorage.setItem(
        "tagoptionUser",
        JSON.stringify(user)
      );


      message.textContent =
        "Account created successfully!";


      setTimeout(() => {
        showLogin();
      }, 1000);
    }


    function login() {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const message =
        document.getElementById("loginMessage");


      const savedUser =
        localStorage.getItem("tagoptionUser");


      if (!savedUser) {
        message.textContent =
          "No account found. Create an account first.";
        return;
      }


      const user =
        JSON.parse(savedUser);


      if (
        email === user.email &&
        password === user.password
      ) {

        message.textContent =
          "Login successful!";

        setTimeout(() => {
          alert(
            "Welcome to TagOption, " + user.name + "!"
          );
        }, 500);

      } else {

        message.textContent =
          "Incorrect email or password.";
      }
    }

  </script>

</body>
</html>
