<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TagOption</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #000;
    }

    .balance {
      background: #eef2ff;
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
      text-align: center;
    }

    .trade-buttons {
      display: flex;
      gap: 10px;
    }

    .trade-buttons button {
      flex: 1;
    }

    .buy {
      background: #16a34a;
    }

    .sell {
      background: #dc2626;
    }

    #dashboard {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>TagOption</h1>
  <p>Simple Trading Platform</p>
</header>

<div class="container">

  <div id="login" class="card">
    <h2>Login</h2>

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="message"></p>
  </div>

  <div id="dashboard">

    <div class="card">

      <h2>Welcome to TagOption</h2>

      <div class="balance">
        <strong>Balance</strong>
        <h2 id="balance">KSh 0.00</h2>
      </div>

      <input type="number" id="amount" placeholder="Enter amount">

      <div class="trade-buttons">

        <button class="buy" onclick="trade('BUY')">
          BUY
        </button>

        <button class="sell" onclick="trade('SELL')">
          SELL
        </button>

      </div>

      <button onclick="logout()">Logout</button>

      <p id="tradeMessage"></p>

    </div>

  </div>

</div>

<script>

function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (email === "" || password === "") {
    document.getElementById("message").innerText =
      "Please enter email and password.";
    return;
  }

  document.getElementById("login").style.display = "none";
  document.getElementById("dashboard").style.display = "block";

}

function logout() {

  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login").style.display = "block";

}

function trade(type) {

  const amount = document.getElementById("amount").value;

  if (amount === "" || amount <= 0) {

    document.getElementById("tradeMessage").innerText =
      "Enter a valid amount.";

    return;
  }

  document.getElementById("tradeMessage").innerText =
    type + " order created for KSh " + amount;

}

</script>

</body>
</html>
