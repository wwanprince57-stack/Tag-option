 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TagOption</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    text-align:center;
    padding:18px;
}

header h1{margin:0 0 5px}
header p{margin:0}

.container{
    max-width:520px;
    margin:20px auto;
    padding:15px;
}

.card{
    background:white;
    padding:22px;
    border-radius:16px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

input,select{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:15px;
}

button{
    width:100%;
    padding:13px;
    margin-top:9px;
    border:0;
    border-radius:9px;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.blue{background:#2563eb}
.green{background:#16a34a}
.red{background:#dc2626}
.dark{background:#111827}
.gray{background:#6b7280}

.hidden{display:none}

.message{
    text-align:center;
    font-weight:bold;
    margin-top:12px;
}

.small{
    color:#6b7280;
    font-size:13px;
}

.balance{
    background:#eef2ff;
    padding:18px;
    border-radius:12px;
    text-align:center;
    margin:15px 0;
}

.balance h2{
    font-size:28px;
    margin:8px 0 0;
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.menu button{
    margin:0;
}

.history-item{
    padding:11px 0;
    border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<header>
    <h1>TagOption</h1>
    <p>Simple Trading Platform</p>
</header>

<div class="container">

    <!-- LOGIN -->
    <section id="loginPage" class="card">
        <h2>LOGIN</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="Email"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Password"
        >

        <button id="loginBtn" class="blue">
            LOGIN
        </button>

        <button id="goSignupBtn" class="dark">
            CREATE ACCOUNT
        </button>

        <p id="loginMessage" class="message"></p>
    </section>


    <!-- SIGN UP -->
    <section id="signupPage" class="card hidden">
        <h2>CREATE ACCOUNT</h2>

        <input
            id="signupName"
            type="text"
            placeholder="Full Name"
        >

        <input
            id="signupEmail"
            type="email"
            placeholder="Email"
        >

        <input
            id="signupPassword"
            type="password"
            placeholder="Strong Password"
        >

        <p class="small">
            Password must contain at least 8 characters,
            uppercase, lowercase, number and symbol.
        </p>

        <button id="signupBtn" class="blue">
            CREATE ACCOUNT
        </button>

        <button id="backLoginBtn" class="gray">
            BACK TO LOGIN
        </button>

        <p id="signupMessage" class="message"></p>
    </section>


    <!-- DASHBOARD -->
    <section id="dashboardPage" class="hidden">

        <div class="card">

            <h2 id="welcomeText">Welcome</h2>

            <div class="balance">
                <div>Available Balance</div>
                <h2 id="balanceText">KSh 0.00</h2>
            </div>

            <div class="menu">

                <button id="depositBtn" class="green">
                    DEPOSIT
                </button>

                <button id="withdrawBtn" class="red">
                    WITHDRAW
                </button>

                <button id="tradeBtn" class="blue">
                    TRADE
                </button>

                <button id="historyBtn" class="dark">
