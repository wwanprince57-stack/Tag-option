 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TagOption</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f4f7;
color:#111827;
}

header{
background:#111827;
color:white;
padding:22px;
text-align:center;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:7px 0 0;
opacity:.8;
}

.card{
width:92%;
max-width:450px;
background:white;
margin:25px auto;
padding:22px;
border-radius:16px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.hidden{display:none}

h2,h3{
margin-top:0;
}

input,select{
width:100%;
padding:14px;
margin:7px 0;
border:1px solid #d1d5db;
border-radius:9px;
font-size:16px;
outline:none;
}

input:focus,select:focus{
border-color:#2563eb;
}

.password-wrap{
position:relative;
width:100%;
}

.password-wrap input{
padding-right:55px;
}

.eye-btn{
position:absolute;
right:5px;
top:5px;
width:45px;
height:43px;
margin:0;
padding:0;
background:transparent;
color:#374151;
font-size:20px;
}

button{
width:100%;
padding:14px;
margin:7px 0;
border:0;
border-radius:9px;
font-size:16px;
font-weight:bold;
color:white;
cursor:pointer;
}

.blue{background:#2563eb}
.green{background:#16a34a}
.red{background:#dc2626}
.dark{background:#111827}
.gray{background:#6b7280}

.message{
text-align:center;
font-weight:bold;
margin-top:12px;
}

.balance{
background:#eef2ff;
padding:18px;
border-radius:12px;
text-align:center;
margin-bottom:18px;
}

.balance h2{
font-size:25px;
margin:8px 0 0;
}

.menu{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.panel{
margin-top:18px;
padding-top:10px;
border-top:1px solid #ddd;
}

.small{
font-size:13px;
color:#6b7280;
line-height:1.5;
}

.success{color:#15803d}
.error{color:#dc2626}

.password-box{
margin-top:5px;
padding:13px;
background:#f9fafb;
border-radius:10px;
font-size:14px;
line-height:1.9;
}

.requirement{
display:block;
font-weight:500;
}

.valid{color:#16a34a}
.invalid{color:#dc2626}

.price-box{
background:#111827;
color:white;
padding:18px;
border-radius:12px;
text-align:center;
margin:10px 0 15px;
}

.price-label{
font-size:12px;
opacity:.7;
}

.demo-price{
font-size:28px;
font-weight:bold;
margin-top:6px;
}

.trade-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.trade-buttons button{
margin:0;
}

.trade-note{
font-size:12px;
color:#6b7280;
text-align:center;
margin-top:10px;
}

.history-item{
padding:13px;
margin:8px 0;
background:#f3f4f6;
border-radius:9px;
}

.call{
color:#15803d;
font-weight:bold;
}

.put{
color:#dc2626;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>TagOption</h1>
<p>Simple Trading Platform</p>
</header>

<h2>LOGIN</
