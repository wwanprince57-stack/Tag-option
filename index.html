 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TagOption</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#07111f;color:#fff}
header{padding:18px;background:#0d1b2d;text-align:center;font-size:25px;font-weight:bold;color:#19e68c}
main{max-width:500px;margin:auto;padding:15px}
.card{background:#0d1b2d;padding:18px;margin:12px 0;border-radius:12px}
input{width:100%;padding:13px;margin:6px 0;background:#07111f;color:#fff;border:1px solid #29415c;border-radius:7px}
button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
.green{background:#19e68c;color:#001}
.red{background:#ff5263;color:#fff}
.blue{background:#29415c;color:#fff}
nav{display:grid;grid-template-columns:1fr 1fr;gap:7px}
h2{margin-top:0}
.balance{font-size:28px;color:#19e68c;font-weight:bold}
.page{display:none}
.page.active{display:block}
.msg{padding:10px;background:#14283d;border-radius:7px;margin-top:8px}
.trade{display:flex;gap:8px}
.trade button{width:50%}
.item{border-bottom:1px solid #29415c;padding:10px 0}
</style>
</head>

<body>

<header>TAGOPTION</header>

<main>

<div class="card">
<h2>Account</h2>
<div id="user">Not logged in</div>
<div class="balance" id="balance">KES 0.00</div>
</div>

<nav>
<button class="blue" onclick="page('home')">HOME</button>
<button class="blue" onclick="page('trade')">TRADE</button>
<button class="blue" onclick="page('deposit')">DEPOSIT</button>
<button class="blue" onclick="page('withdraw')">WITHDRAW</button>
<button class="blue" onclick="page('history')">HISTORY</button>
<button class="blue" onclick="page('profile')">PROFILE</button>
</nav>

<!-- HOME -->
<section id="home" class="page active">
<div class="card">
<h2>Welcome to TagOption</h2>
<p>Simple trading platform.</p>
<button class="green" onclick="page('register')">CREATE ACCOUNT</button>
<button class="blue" onclick="page('login')">LOGIN</button>
</div>
</section>

<!-- REGISTER -->
<section id="register" class="page">
<div class="card">
<h2>Create Account</h2>
<input id="ruser" placeholder="Username">
<input id="rpass" type="password" placeholder="Password">
<input id="rconfirm" type="password" placeholder="Confirm Password">
<button class="green" onclick="register()">CREATE ACCOUNT</button>
<div id="rmsg" class="msg"></div>
</div>
</section>

<!-- LOGIN -->
<section id="login" class="page">
<div class="card">
<h2>Login</h2>
<input id="luser" placeholder="Username">
<input id="lpass" type="password" placeholder="Password">
<button class="green" onclick="login()">LOGIN</button>
<div id="lmsg" class="msg"></div>
</div>
</section>

<!-- TRADE -->
<section id="trade" class="page">
<div class="card">
<h2>Trade</h2>
<input id="asset" value="Volatility 100">
<input id="stake" type="number" placeholder="Stake">
<div class="trade">
<button class="green" onclick="trade('BUY')">BUY</button>
<button class="red" onclick="trade('SELL')">SELL</button>
</div>
<div id="tmsg" class="msg"></div>
</div>
</section>

<!-- DEPOSIT -->
<section id="deposit" class="page">
<div class="card">
<h2>Deposit</h2>
<p>Demo balance only.</p>
<input id="dep" type="number" placeholder="Amount">
<button class="green" onclick="deposit()">DEPOSIT</button>
<div id="dmsg" class="msg"></div>
</div>
</section>

<!-- WITHDRAW -->
<section id="withdraw" class="page">
<div class="card">
<h2>Withdraw</h2>
<p>Demo balance only.</p>
<input id="with" type="number" placeholder="Amount">
<button class="green" onclick="withdraw()">WITHDRAW</button>
<div id="wmsg" class="msg"></div>
</div>
</section>

<!-- HISTORY -->
<section id="history" class="page">
<div class="card">
<h2>Trade History</h2>
<div id="list">No trades.</div>
</div>
</section>

<!-- PROFILE -->
<section id="profile" class="page">
<div class="card">
<h2>Profile</h2>
<p id="profile">Not logged in</p>
<button class="red" onclick="logout()">LOGOUT</button>
</div>
</section>

</main>

<script>

let current=localStorage.getItem("tagUser");

function accounts(){
return JSON.parse(localStorage.getItem("tagAccounts")||"{}");
}

function save(a){
localStorage.setItem("tagAccounts",JSON.stringify(a));
}

function page(id){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(id).classList.add("active");
update();
}

function register(){

let u=document.getElementById("ruser").value.trim();
let p=document.getElementById("rpass").value;
let c=document.getElementById("rconfirm").value;
let a=accounts();

if(u.length<3){
rmsg.textContent="Username must be at least 3 characters.";
return;
}

if(p.length<6){
rmsg.textContent="Password must be at least 6 characters.";
return;
}

if(p!==c){
rmsg.textContent="Passwords do not match.";
return;
}

if(a[u]){
rmsg.textContent="Username already exists.";
return;
}

a[u]={password:p,balance:0,history:[]};
save(a);

current=u;
localStorage.setItem("tagUser",u);

rmsg.textContent="Account created successfully.";
page("home");
}

function login(){

let u=document.getElementById("luser").value.trim();
let p=document.getElementById("lpass").value;
let a=accounts();

if(!a[u]){
lmsg.textContent="Account not found.";
return;
}

if(a[u].password!==p){
lmsg.textContent="Wrong password.";
return;
}

current=u;
localStorage.setItem("tagUser",u);
lmsg.textContent="Login successful.";
page("home");
}

function logout(){
current=null;
localStorage.removeItem("tagUser");
page("home");
}

function data(){
let a=accounts();
return current?a[current]:null;
}

function update(){

let d=data();

user.textContent=current?"Logged in: "+current:"Not logged in";

balance.textContent="KES "+(d?d.balance:0).toFixed(2);

profile.textContent=current?current:"Not logged in";

let list=document.getElementById("list");

if(!d||d.history.length===0){
list.textContent="No trades.";
return;
}

list.innerHTML=d.history.map(x=>
'<div class="item">'+
x.type+" | "+x.asset+
"<br>Stake: KES "+x.stake+
"<br>"+x.time+
"</div>"
).join("");
}

function deposit(){

if(!current){
dmsg.textContent="Login first.";
return;
}

let n=Number(document.getElementById("dep").value);

if(n<=0){
dmsg.textContent="Enter amount.";
return;
}

let a=accounts();
a[current].balance+=n;
save(a);

dmsg.textContent="Demo deposit successful.";
update();
}

function withdraw(){

if(!current){
wmsg.textContent="Login first.";
return;
}

let n=Number(document.getElementById("with").value);
let a=accounts();

if(n<=0){
wmsg.textContent="Enter amount.";
return;
}

if(n>a[current].balance){
wmsg.textContent="Insufficient balance.";
return;
}

a[current].balance-=n;
save(a);

wmsg.textContent="Demo withdrawal successful.";
update();
}

function trade(type){

if(!current){
tmsg.textContent="Login first.";
return;
}

let n=Number(document.getElementById("stake").value);
let a=accounts();

if(n<=0){
tmsg.textContent="Enter stake.";
return;
}

if(n>a[current].balance){
tmsg.textContent="Insufficient balance.";
return;
}

a[current].balance-=n;

a[current].history.unshift({
type:type,
asset:document.getElementById("asset").value,
stake:n,
time:new Date().toLocaleString()
});

save(a);

tmsg.textContent=type+" trade recorded.";
update();
}

update();

</script>

</body>
</html>
